<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dimitry Hub</title>
  <meta name="theme-color" content="#f2475e">
  <link rel="icon" href="/static/brand-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,500;6..12,600;6..12,700;6..12,800&family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-theme="obsidian-gold" data-font="study-pro" data-simple="1">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand" data-route="home" aria-label="Ir al inicio">
        <span class="brand-mark"><img src="/static/brand-icon.png" alt="Dimitry Hub"></span>
        <span><b>Dimitry Hub</b><small>Arcane Royal</small></span>
      </button>
      <nav class="nav" aria-label="Navegación principal">
        <button class="nav-item active" data-route="home"><span>⌂</span>Inicio</button>
        <button class="nav-item ai-nav" data-route="assistant"><span>✦</span>Dimitry AI</button>
        <button class="nav-item" data-route="study"><span>✎</span>Estudio</button>
        <button class="nav-item" data-route="palworld-wiki"><span>◉</span>Palworld Wiki</button>
        <button class="nav-item" data-route="palworld-editor"><span>▣</span>Editor Palworld</button>
        <button class="nav-item" data-route="gamemod"><span>⌘</span>Game Lab</button>
        <div class="nav-divider">BIBLIOTECA</div>
        <button class="nav-item advanced-nav" data-route="projects"><span>▦</span>Proyectos</button>
        <button class="nav-item advanced-nav" data-route="files"><span>▤</span>Archivos</button>
        <button class="nav-item" data-route="updates"><span>↻</span>Actualizaciones</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-route="settings"><span>⚙</span>Ajustes</button>
        <div class="online-pill"><i></i><span id="connectionText">Preparado</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Abrir menú">☰</button>
        <div class="page-title"><small id="crumb">PANEL PRINCIPAL</small><h1 id="title">Inicio</h1></div>
        <div class="top-actions">
          <button class="sync-mini" id="quickSync" title="Sincronizar las bibliotecas y datos conectados"><span>↻</span><b>Sincronizar datos</b></button>
          <button class="avatar" id="profileChip" title="Perfil y control rápido">DV</button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="toastStack" class="toast-stack"></div>
  <div id="modal" class="modal-layer hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head"><div><small>DIMITRY HUB</small><h2 id="modalTitle">Ventana</h2></div><button class="icon-btn" id="modalClose">×</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <script src="/static/app.js?v=1.1.1-fix9"></script>
</body>
</html>
