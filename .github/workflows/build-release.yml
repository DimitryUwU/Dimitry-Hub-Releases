name: Validar y compilar Dimitry Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Escribe PUBLICAR para crear una versión oficial"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: dimitry-hub-release
  cancel-in-progress: true

jobs:
  validar-y-compilar:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Leer configuración
        id: config
        shell: pwsh
        run: |
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          if (-not $config.version) { throw 'Falta version en release-config.json.' }
          "version=$($config.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($config.version)" >> $env:GITHUB_OUTPUT

      - name: Preparar código fuente legible
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          if (-not (Test-Path 'src/app/main.py')) { throw 'Falta el árbol src.' }
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item src build/src -Recurse -Force
          @"
          APP_VERSION = "$($config.version)"
          APP_NAME = "Dimitry Hub"
          UPDATE_REPOSITORY = "DimitryUwU/Dimitry-Hub-Releases"
          LATEST_MANIFEST_URL = "https://raw.githubusercontent.com/DimitryUwU/Dimitry-Hub-Releases/main/latest.json"
          "@ | Set-Content 'build/src/app/version.py' -Encoding utf8
          $config.version | Set-Content 'build/src/VERSION.txt' -Encoding ascii

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/src/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/src/requirements.txt
          python -m pip install pyinstaller

      - name: Validate application
        shell: pwsh
        working-directory: build/src
        run: |
          python -m compileall app run.py updater.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check app/static/app.js
          python -c "from app.main import app; assert any(r.path == '/api/palworld/workspace/upload' for r in app.routes)"

      - name: Build Windows executables
        shell: pwsh
        working-directory: build/src
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DimitryHub --icon dimitry_hub.ico --add-data "app/static;app/static" --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on run.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DimitryHubUpdater updater.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: build/src
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'No se encontró Inno Setup.' }
          & $iscc "/DMyAppVersion=${{ steps.config.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup terminó con código $LASTEXITCODE." }

      - name: Probar instalación y arranque
        shell: pwsh
        working-directory: build/src
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release/Dimitry_Hub_Setup_x64.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'DimitryHub-Installed'
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "El instalador terminó con código $($install.ExitCode)." }
          $appExe = Join-Path $installDir 'DimitryHub.exe'
          if (-not (Test-Path $appExe)) { throw 'El ejecutable instalado no existe.' }
          $appProcess = Start-Process -FilePath $appExe -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'La aplicación instalada no respondió a tiempo.' }
            $home = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/' -TimeoutSec 5
            if ($home.Content -notmatch 'Dimitry Hub') { throw 'La página inicial instalada no contiene el contenido esperado.' }
            Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8765/api/system/shutdown' -TimeoutSec 5 | Out-Null
            Wait-Process -Id $appProcess.Id -Timeout 20 -ErrorAction SilentlyContinue
          } finally {
            Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'No se encontró el desinstalador.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "El desinstalador terminó con código $($uninstall.ExitCode)." }

      - name: Generate manifest and checksums
        shell: pwsh
        working-directory: build/src
        env:
          RELEASE_VERSION: ${{ steps.config.outputs.version }}
          RELEASE_TAG: ${{ steps.config.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $installer = Resolve-Path 'release/Dimitry_Hub_Setup_x64.exe'
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $config = Get-Content '../../release-config.json' -Raw | ConvertFrom-Json
          [ordered]@{
            version = $env:RELEASE_VERSION
            installer_url = "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/Dimitry_Hub_Setup_x64.exe"
            sha256 = $sha
            notes = $config.notes
            published_at = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8
          "$sha  Dimitry_Hub_Setup_x64.exe" | Set-Content checksums.sha256 -Encoding ascii
          $config.notes | Set-Content release-notes.txt -Encoding utf8

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publicar == 'PUBLICAR'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.config.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $env:RELEASE_TAG --yes --cleanup-tag }
          gh release create $env:RELEASE_TAG build/src/release/Dimitry_Hub_Setup_x64.exe build/src/checksums.sha256 build/src/latest.json --title "Dimitry Hub $env:RELEASE_TAG" --notes-file build/src/release-notes.txt --latest

      - name: Publish latest manifest on main
        if: github.event_name == 'workflow_dispatch' && inputs.publicar == 'PUBLICAR'
        shell: pwsh
        run: |
          Copy-Item build/src/latest.json latest.json -Force
          Copy-Item build/src/checksums.sha256 checksums.sha256 -Force
          git config user.name 'Dimitry Hub Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json checksums.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update latest manifest to v${{ steps.config.outputs.version }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dimitry-Hub-${{ steps.config.outputs.version }}
          if-no-files-found: error
          path: |
            build/src/release/Dimitry_Hub_Setup_x64.exe
            build/src/latest.json
            build/src/checksums.sha256
