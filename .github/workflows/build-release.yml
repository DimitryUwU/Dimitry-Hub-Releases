name: Build and publish Dimitry Hub

on:
  push:
    branches: [main]
    paths:
      - "payload/**"
      - ".github/workflows/build-release.yml"
      - "release-config.json"
  pull_request:
    branches: [main]
    paths:
      - "payload/**"
      - ".github/workflows/build-release.yml"
      - "release-config.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dimitry-hub-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release configuration
        id: config
        shell: pwsh
        run: |
          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          if (-not $config.version) { throw 'release-config.json no contiene version.' }
          if (-not $config.source_sha256) { throw 'release-config.json no contiene source_sha256.' }
          "version=$($config.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($config.version)" >> $env:GITHUB_OUTPUT

      - name: Restore and verify source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build | Out-Null

          function Read-B64([string]$Path) {
            if (-not (Test-Path $Path)) { throw "Falta $Path" }
            $raw = Get-Content $Path -Raw
            return [regex]::Replace($raw, '[^A-Za-z0-9+/=]', '')
          }

          $chunks = [System.Collections.Generic.List[string]]::new()
          0..9 | ForEach-Object { $chunks.Add((Read-B64 ("payload/part-{0:D2}.b64" -f $_))) }

          $repaired10 = (Read-B64 'payload/repair-10-00.b64') + (Read-B64 'payload/repair-10-01.b64')
          if ($repaired10.Length -ne 18000) { throw "La parte 10 reparada mide $($repaired10.Length), no 18000." }
          $chunks.Add($repaired10)

          $part11 = Read-B64 'payload/part-11.b64'
          if ($part11.Length -lt 18000) { throw 'La parte 11 está incompleta.' }
          $chunks.Add($part11.Substring(0, 18000))

          12..16 | ForEach-Object { $chunks.Add((Read-B64 ("payload/part-{0:D2}.b64" -f $_))) }

          $base64 = $chunks -join ''
          Write-Host "Longitud Base64 reconstruida: $($base64.Length)"
          if (($base64.Length % 4) -ne 0) { throw 'La longitud Base64 no es múltiplo de 4.' }
          [IO.File]::WriteAllBytes('build/source.zip', [Convert]::FromBase64String($base64))

          $config = Get-Content release-config.json -Raw | ConvertFrom-Json
          $expected = $config.source_sha256.ToLowerInvariant()
          $actual = (Get-FileHash 'build/source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "La verificación del código fuente falló. Esperado: $expected. Obtenido: $actual."
          }

          New-Item -ItemType Directory -Force 'build/src' | Out-Null
          Expand-Archive 'build/source.zip' 'build/src' -Force

          @'
          DIMITRY HUB 1.0

          Ejecuta Dimitry_Hub_Setup_x64.exe para instalar o actualizar.
          La aplicación consulta el canal oficial al iniciarse, verifica SHA-256
          y conserva proyectos, documentos y ajustes en:
          %LOCALAPPDATA%\Dimitry Hub\Data
          '@ | Set-Content 'build/src/LEEME_PRIMERO.txt' -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/src/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/src/requirements.txt
          python -m pip install pyinstaller

      - name: Validate application
        shell: pwsh
        working-directory: build/src
        run: |
          python -m compileall app run.py updater.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Build Windows executables
        shell: pwsh
        working-directory: build/src
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DimitryHub --icon dimitry_hub.ico --add-data "app/static;app/static" --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on run.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DimitryHubUpdater updater.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: build/src
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'No se encontró ISCC.exe.' }
          & $iscc "/DMyAppVersion=${{ steps.config.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup terminó con código $LASTEXITCODE." }

      - name: Generate update manifest and checksums
        shell: pwsh
        working-directory: build/src
        env:
          RELEASE_VERSION: ${{ steps.config.outputs.version }}
          RELEASE_TAG: ${{ steps.config.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $installer = Resolve-Path 'release/Dimitry_Hub_Setup_x64.exe'
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $config = Get-Content '../../release-config.json' -Raw | ConvertFrom-Json
          [ordered]@{
            version = $env:RELEASE_VERSION
            installer_url = "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/Dimitry_Hub_Setup_x64.exe"
            sha256 = $sha
            notes = $config.notes
            published_at = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8
          "$sha  Dimitry_Hub_Setup_x64.exe" | Set-Content checksums.sha256 -Encoding ascii
          $config.notes | Set-Content release-notes.txt -Encoding utf8

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.config.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $env:RELEASE_TAG --yes --cleanup-tag }
          gh release create $env:RELEASE_TAG build/src/release/Dimitry_Hub_Setup_x64.exe build/src/checksums.sha256 build/src/latest.json --title "Dimitry Hub $env:RELEASE_TAG" --notes-file build/src/release-notes.txt --latest

      - name: Publish latest manifest on main branch
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          Copy-Item build/src/latest.json latest.json -Force
          Copy-Item build/src/checksums.sha256 checksums.sha256 -Force
          git config user.name 'Dimitry Hub Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json checksums.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update latest manifest to v${{ steps.config.outputs.version }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dimitry-Hub-${{ steps.config.outputs.version }}
          if-no-files-found: error
          path: |
            build/src/release/Dimitry_Hub_Setup_x64.exe
            build/src/latest.json
            build/src/checksums.sha256
